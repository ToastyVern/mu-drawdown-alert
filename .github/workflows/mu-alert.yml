name: MU drawdown alert

on:
  schedule:
    # Every 20 minutes, 13:00-21:59 UTC, Mon-Fri.
    # Covers the US cash session in both EDT (13:30-20:00 UTC) and EST (14:30-21:00 UTC).
    # check_mu.py gates the exact 09:30-16:00 America/New_York window itself.
    - cron: "*/20 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test_price:
        description: "Force a price to test the alert path (leave blank for live)"
        required: false
        default: ""

concurrency:
  group: mu-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check MU against drawdown levels
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PRICE: ${{ github.event.inputs.test_price }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python check_mu.py

      - name: Persist state / keep the schedule alive
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "mu-alert-bot"
          git config user.email "actions@github.com"

          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            # GitHub disables scheduled workflows after 60 days without repo
            # activity. If nothing has been committed in 20 days, push a
            # heartbeat so a long quiet stretch never kills the schedule.
            last=$(git log -1 --format=%ct)
            age=$(( ( $(date +%s) - last ) / 86400 ))
            if (( age < 20 )); then
              echo "state unchanged, nothing to push"
              exit 0
            fi
            date -u +%Y-%m-%dT%H:%MZ > .heartbeat
            git add .heartbeat
            git commit -m "heartbeat: keep schedule alive"
          fi

          # Never force-push. If the branch has moved on, or this is a re-run of
          # an older commit, replay onto the current tip and retry once. If it
          # still refuses, leave the remote untouched: the alert already went
          # out, and the next scheduled run recomputes state from the remote.
          for attempt in 1 2; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}), replaying onto origin/${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}" || break
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null || true; break; }
          done

          echo "::warning::state not pushed; next scheduled run will redo it"
          exit 0
